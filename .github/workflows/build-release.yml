name: Build release packages

# 2.0 release-prep validation: the feature branch builds the same packages that
# will be produced manually from main after merge/tag approval.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version confirmation/override; leave empty to use VERSION.txt"
        required: false
        type: string
  push:
    branches:
      - feature/virtual-gamepad-ui
    paths:
      - '.github/workflows/build-release.yml'
      - 'MugenDeej.ps1'
      - 'VERSION.txt'
      - 'MugenDeej-Debug.cmd'
      - 'MugenDeej.ico'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
      - 'packaging/README.txt.template'
      - 'src/launcher/**'
      - 'src/setup/**'
      - 'src/virtual-gamepad-helper/**'
      - 'src/virtual-gamepad-integration/MugenDeej.VirtualGamepad.ps1'
      - 'arduino/MugenDeejCardboardNanoPrototype/**'
      - 'tools/Prepare-HIDMaestro.ps1'
      - 'tools/Build-Release.ps1'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: [self-hosted, windows, x64]
    env:
      # The non-admin self-hosted runner cannot install to C:\Program Files\dotnet.
      # Keep the SDK under the writable runner temp folder instead.
      DOTNET_INSTALL_DIR: ${{ runner.temp }}\dotnet

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/launcher/go.mod
          cache: false

      - name: Build portable ZIP and Setup EXE
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_VERSION)) {
            .\tools\Build-Release.ps1
          }
          else {
            .\tools\Build-Release.ps1 -Version $env:REQUESTED_VERSION
          }

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: Mugen-Deej-packages-${{ github.run_number }}
          path: |
            artifacts/Mugen-Deej-*-Portable.zip
            artifacts/Mugen-Deej-*-Portable.zip.sha256
            artifacts/Mugen-Deej-*-Setup.exe
            artifacts/Mugen-Deej-*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
