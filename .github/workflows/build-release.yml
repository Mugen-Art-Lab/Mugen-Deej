name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version confirmation/override; leave empty to use VERSION.txt"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/launcher/go.mod
          cache: false

      - name: Build portable ZIP and Setup EXE
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:REQUESTED_VERSION)) {
            .\tools\Build-Release.ps1
          }
          else {
            .\tools\Build-Release.ps1 -Version $env:REQUESTED_VERSION
          }

      - name: Upload release packages
        uses: actions/upload-artifact@v7
        with:
          name: Mugen-Deej-packages-${{ github.run_number }}
          path: |
            artifacts/Mugen-Deej-*-Portable.zip
            artifacts/Mugen-Deej-*-Portable.zip.sha256
            artifacts/Mugen-Deej-*-Setup.exe
            artifacts/Mugen-Deej-*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
