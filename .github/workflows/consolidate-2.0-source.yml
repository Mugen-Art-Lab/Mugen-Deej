name: Consolidate 2.0 source from RC255

on:
  push:
    branches:
      - feature/virtual-gamepad-ui
    paths:
      - '.github/workflows/consolidate-2.0-source.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: windows-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/virtual-gamepad-ui
          fetch-depth: 0

      - name: Reproduce hardware-proven RC255 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'mugen-2.0-consolidation'
          $runtimePath = Join-Path $stage 'MugenDeej.ps1'
          $vgRoot = Join-Path $stage 'virtual-gamepad'
          $modulePath = Join-Path $vgRoot 'MugenDeej.VirtualGamepad.ps1'
          New-Item -ItemType Directory -Path $vgRoot -Force | Out-Null

          .\tools\Build-VirtualGamepad-Integration.ps1 `
            -SourcePath .\MugenDeej.ps1 `
            -OutputPath $runtimePath

          .\tools\Harden-VirtualGamepad-DevRuntime.ps1 -Path $runtimePath -PreserveStartupRegistration
          .\tools\Apply-AdaptiveProtocol.ps1 -Path $runtimePath
          .\tools\Apply-AdaptiveButtonUi.ps1 -Path $runtimePath
          .\tools\Apply-AdaptiveInputStatusUi.ps1 -Path $runtimePath
          .\tools\Polish-AdaptiveInputStatusUi.ps1 -Path $runtimePath
          .\tools\Run-OptimizedLargeButtonSettings.ps1 -Path $runtimePath
          .\tools\Apply-PerControllerSliderInversion.ps1 -Path $runtimePath

          Copy-Item .\src\virtual-gamepad-integration\MugenDeej.VirtualGamepad.ps1 $modulePath -Force

          $asyncStopOverlay = [System.IO.File]::ReadAllText(
            (Resolve-Path '.\src\virtual-gamepad-integration\MugenDeej.VirtualGamepad.AsyncStop.ps1'),
            [System.Text.Encoding]::UTF8
          )
          [System.IO.File]::AppendAllText(
            $modulePath,
            ("`r`n" + $asyncStopOverlay),
            (New-Object System.Text.UTF8Encoding($false))
          )

          .\tools\Ensure-WindowsPowerShellUtf8Bom.ps1 -Path @(
            $runtimePath,
            $modulePath
          )

          .\tools\Polish-UiLanguage.ps1 `
            -RuntimePath $runtimePath `
            -IntegrationModulePath $modulePath

          $strictUtf8 = New-Object System.Text.UTF8Encoding($false, $true)
          $rcText = [System.IO.File]::ReadAllText($runtimePath, $strictUtf8)

          if (($rcText.Split("# Mugen Deej 1.0.0").Count - 1) -ne 1) {
            throw 'Expected exactly one RC source-header identity anchor.'
          }
          $rcAppVersion = '$script:AppVersion = ''2.0.0-rc1'''
          $finalAppVersion = '$script:AppVersion = ''2.0.0'''
          if (($rcText.Split($rcAppVersion).Count - 1) -ne 1) {
            throw 'Expected exactly one RC AppVersion identity anchor.'
          }

          $finalText = $rcText.Replace('# Mugen Deej 1.0.0', '# Mugen Deej 2.0.0')
          $finalText = $finalText.Replace($rcAppVersion, $finalAppVersion)

          if ($finalText -match '2\.0\.0-rc1') {
            throw 'RC identity remains in the consolidated runtime.'
          }

          $roundTrip = $finalText.Replace('# Mugen Deej 2.0.0', '# Mugen Deej 1.0.0')
          $roundTrip = $roundTrip.Replace($finalAppVersion, $rcAppVersion)
          if ($roundTrip -cne $rcText) {
            throw 'Final runtime differs from RC255 staging by more than release identity.'
          }

          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'MugenDeej.ps1'),
            $finalText,
            (New-Object System.Text.UTF8Encoding($true))
          )
          Copy-Item $modulePath .\src\virtual-gamepad-integration\MugenDeej.VirtualGamepad.ps1 -Force
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'VERSION.txt'),
            "2.0.0`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )

          $rcHash = (Get-FileHash $runtimePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $finalHash = (Get-FileHash .\MugenDeej.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          $moduleHash = (Get-FileHash .\src\virtual-gamepad-integration\MugenDeej.VirtualGamepad.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()

          $expectedRcHash = '2e41804c7ac4303f94aa126ebcbd251f558b030650e8804ee2046735e0239452'
          $expectedFinalHash = '47639e7f4c4217727c1e693ba309f4b0d12f39ac18e1fc223035be609a7b7023'
          $expectedModuleHash = '8cee712cf8fede4fbbb9635fef6ea647e84ade9047d7090b104896ea1317e868'

          if ($rcHash -ne $expectedRcHash) {
            throw "RC255 runtime reproduction hash mismatch: $rcHash"
          }
          if ($finalHash -ne $expectedFinalHash) {
            throw "Consolidated final runtime identity-only hash mismatch: $finalHash"
          }
          if ($moduleHash -ne $expectedModuleHash) {
            throw "RC255 virtual module reproduction hash mismatch: $moduleHash"
          }

          Write-Host "RC255 staged runtime SHA-256:        $rcHash"
          Write-Host "Final identity-only runtime SHA-256: $finalHash"
          Write-Host "RC255 virtual module SHA-256:        $moduleHash"

      - name: Windows PowerShell 5.1 parse and identity checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            '.\MugenDeej.ps1',
            '.\src\virtual-gamepad-integration\MugenDeej.VirtualGamepad.ps1'
          )

          foreach ($path in $paths) {
            $resolved = (Resolve-Path $path).Path
            $bytes = [System.IO.File]::ReadAllBytes($resolved)
            if (
              $bytes.Length -lt 3 -or
              $bytes[0] -ne 0xEF -or
              $bytes[1] -ne 0xBB -or
              $bytes[2] -ne 0xBF
            ) {
              throw "Consolidated Windows PowerShell source is missing UTF-8 BOM: $path"
            }

            $tokens = $null
            $errors = $null
            $text = [System.IO.File]::ReadAllText(
              $resolved,
              (New-Object System.Text.UTF8Encoding($false, $true))
            )
            [System.Management.Automation.Language.Parser]::ParseInput(
              $text,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) {
                Write-Error ("{0}:{1}: {2}" -f $parseError.Extent.StartLineNumber,$parseError.Extent.StartColumnNumber,$parseError.Message)
              }
              throw "PowerShell 5.1 parse check failed for $path"
            }
          }

          $runtimeText = [System.IO.File]::ReadAllText(
            (Resolve-Path '.\MugenDeej.ps1'),
            [System.Text.Encoding]::UTF8
          )
          if ($runtimeText -notmatch '(?m)^# Mugen Deej 2\.0\.0\s*$') {
            throw 'Consolidated source header is not 2.0.0.'
          }
          if ($runtimeText -notmatch '\$script:AppVersion = ''2\.0\.0''') {
            throw 'Consolidated AppVersion is not 2.0.0.'
          }
          if ((Get-Content .\VERSION.txt -Raw -Encoding UTF8).Trim() -ne '2.0.0') {
            throw 'VERSION.txt is not 2.0.0.'
          }

      - name: Commit consolidated source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MugenDeej.ps1 VERSION.txt src/virtual-gamepad-integration/MugenDeej.VirtualGamepad.ps1
          git diff --cached --check

          if ([string]::IsNullOrWhiteSpace((git status --porcelain))) {
            throw 'Consolidation produced no repository changes.'
          }

          git commit -m "release: consolidate hardware-proven 2.0 runtime"
          git push origin HEAD:feature/virtual-gamepad-ui
