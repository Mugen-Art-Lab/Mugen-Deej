name: Promote 1.0.0 source

on:
  push:
    branches:
      - release/1.0.0
    paths:
      - .github/workflows/promote-1.0.0-source.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest

    steps:
      - name: Check out release branch
        uses: actions/checkout@v7
        with:
          ref: release/1.0.0

      - name: Promote tested staged source
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\Promote-1.0.0-Source.ps1

      - name: Verify promoted runtime matches tested package
        shell: pwsh
        run: |
          $expected = 'eeedd92aaca6926d457b67f231af5ba55b646a00c152eebd5794591bb85ad481'
          $actual = (Get-FileHash -LiteralPath .\MugenDeej.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Promoted MugenDeej.ps1 hash mismatch. Expected $expected, got $actual."
          }
          Write-Host "Promoted runtime hash verified: $actual"

      - name: Verify only expected source files changed
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $expected = @('MugenDeej.ps1', 'src/setup/setup.ps1')
          $unexpected = @($changed | Where-Object { $_ -notin $expected })
          $missing = @($expected | Where-Object { $_ -notin $changed })
          if ($unexpected.Count -gt 0 -or $missing.Count -gt 0) {
            throw "Unexpected promotion diff. Changed: $($changed -join ', ')"
          }
          git diff --check
          Write-Host "Promotion diff contains exactly: $($changed -join ', ')"

      - name: Commit promoted source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MugenDeej.ps1 src/setup/setup.ps1
          git commit -m 'release: promote tested 1.0.0 source'
          git push origin HEAD:release/1.0.0
