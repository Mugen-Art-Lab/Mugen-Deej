          }
          if ($helperText -notmatch 'parts\.Length != 10') {
            throw 'Virtual controller helper is missing D-pad/trigger fields in the state protocol.'
          }
          if ($helperText -notmatch 'HMHat\.NorthWest') {
            throw 'Virtual controller helper is missing 8-way D-pad output.'
          }
          if ($helperText -notmatch 'leftTrigger: lt') {
            throw 'Virtual controller helper is missing left-trigger output.'
          }
          if ($helperText -notmatch 'rightTrigger: rt') {
            throw 'Virtual controller helper is missing right-trigger output.'
          }
          if ($helperText -notmatch 'PRESEED_GIP_NEUTRAL') {
            throw 'Virtual controller helper is missing the pre-PnP neutral XUSB seed.'
          }
          if ($helperText -notmatch 'gipDataOffset = 8 \+ 256') {
            throw 'Virtual controller helper is missing the pinned HIDMaestro GIP shared-memory offset.'
          }

      - name: Build Mugen Deej launcher
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifacts\Mugen-Deej-VirtualGamepad-Integrated-Dev'
          $launcherDir = Join-Path $PWD 'src\launcher'
          $resource = Join-Path $launcherDir 'rsrc_windows_amd64.syso'

          Push-Location $launcherDir
          try {
            if (Test-Path $resource) { Remove-Item $resource -Force }
            go run github.com/akavel/rsrc@v0.10.2 -arch amd64 -ico (Join-Path $PWD '..\..\MugenDeej.ico') -o $resource
            if ($LASTEXITCODE -ne 0) { throw "rsrc failed with exit code $LASTEXITCODE" }

            $env:GOOS = 'windows'
            $env:GOARCH = 'amd64'
            $env:CGO_ENABLED = '0'
            go build -trimpath -ldflags '-H windowsgui -s -w' -o (Join-Path $stage 'MugenDeej.exe') .
            if ($LASTEXITCODE -ne 0) { throw "go build failed with exit code $LASTEXITCODE" }
          }
          finally {
            Pop-Location
            if (Test-Path $resource) { Remove-Item $resource -Force }
          }

      - name: Add dev package notes
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifacts\Mugen-Deej-VirtualGamepad-Integrated-Dev'
          $text = @'
          Mugen Deej — Virtual Gamepad Integrated Dev Build

          Experimental feature branch build. Stable v1.0.0 is not modified.

          Test path:
          1. Close any other Mugen Deej instance so this build can own the controller COM port.
          2. Start MugenDeej.exe.
          3. Connect the tested Extended controller or an Adaptive v3 test fixture.
          4. Open Configure buttons.
          5. Set Virtual controller to Xbox 360 / XInput.
          6. Use Choose gamepad button... for each physical button you want to map.
          7. Click Save and accept elevation if Windows shows it.
          8. Check joy.cpl for Mugen Deej Virtual Gamepad.

          Protocol generations in this dev build: Legacy, Extended, Adaptive v3.
          Adaptive v3 packets begin with v3 and can report sliders, momentary buttons, latching toggles and cumulative-position rotary encoders as first-class input types.
          Adaptive builds show live first-class toggle switches plus a rotary-knob position indicator and encoder-push state on the main window without pretending they are ordinary buttons.
          For controllers with more than 12 buttons, Button Settings uses a compact live selector grid, one shared action editor and a fixed-height assignment overview. Pressing a physical button should automatically select the matching numbered tile.
          The virtual controller is OFF by default. Its setting is stored in virtual-controller.json next to the app.
          Windows startup registration is intentionally disabled in this development package so it cannot replace the stable Mugen Deej autostart path.
          Adaptive toggles and encoders now have first-class action mapping: separate toggle ON/OFF actions plus encoder CW/CCW/push actions. These typed controls can use standard Mugen actions; virtual-gamepad output remains mapped from momentary buttons in this milestone.
          Momentary-button application profiles are PC-side and work with both Extended and Adaptive controllers. Legacy controllers remain unchanged because they expose no buttons. Existing button-actions.json remains the Global fallback, and older backups/profiles without per-application button payloads continue to load through that Global path.
          Physical buttons can also hold the virtual Xbox left/right stick in any cardinal direction. Releasing the button returns that axis to center; opposite directions cancel to center. Effective profile changes neutralize all virtual state and suppress already-held physical inputs until release.
          Low-latency XInput pass: while the virtual gamepad is active, the desktop serial drain uses a 5 ms target cadence, gameplay mappings are cached outside the button hot path, and state updates are one-way to the elevated helper instead of waiting for a per-input pipe acknowledgement.
          Rapid-repeat hardening: active XInput no longer writes every physical press/release synchronously to the log file, and virtual Xbox mappings exit the legacy press-only action dispatcher before its 80 ms debounce/logging path. This keeps rapid gameplay edges from doing avoidable filesystem work on the 5 ms serial/UI loop.
          Firmware latency experiment: the bundled Cardboard Nano sketch lowers matrix debounce from 18 ms to 6 ms and emits cumulative debounce diagnostics. "filtered" counts raw reversals suppressed before acceptance; "rapid" counts accepted transitions that reversed again within 35 ms. The app logs diagnostic changes with the affected B1..B28/T1/T2 contact mask.
          Layer/XInput UX: configuring an Xbox gamepad action inside Control layers now turns XInput on automatically when the layer settings are saved. The auto-enable only happens when a virtual mapping was actually configured in that editing session, so an explicit manual XInput Off is not undone by unrelated layer edits.
          Physical-button settings hot-unplug hardening: the live button-selection timer now uses isolated editor state and explicitly pauses topology inspection while the controller is disconnected, so unplugging an Extended/Adaptive controller while the modal button editor is open no longer throws a LastButtons property exception.
          UI language polish: normal settings now prefer user-facing terms such as Button actions, Layer switching, Same as base layer, and Virtual Xbox gamepad; COM/protocol/baud details remain available in diagnostics.
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $stage 'VIRTUAL-GAMEPAD-DEV.txt'),
            $text,
            (New-Object System.Text.UTF8Encoding($false))
          )

      - name: Package integrated dev build
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifacts\Mugen-Deej-VirtualGamepad-Integrated-Dev'
          $zip = Join-Path $PWD 'artifacts\Mugen-Deej-VirtualGamepad-Integrated-Dev.zip'
          $shaFile = $zip + '.sha256'

          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            $shaFile,
            "$hash  Mugen-Deej-VirtualGamepad-Integrated-Dev.zip`r`n",
            (New-Object System.Text.UTF8Encoding($false))
          )
          Write-Host "Integrated dev ZIP SHA-256: $hash"

      - name: Upload integrated dev artifact
        uses: actions/upload-artifact@v7
        with:
          name: Mugen-Deej-VirtualGamepad-Integrated-${{ github.run_number }}
          path: |
            artifacts/Mugen-Deej-VirtualGamepad-Integrated-Dev.zip
            artifacts/Mugen-Deej-VirtualGamepad-Integrated-Dev.zip.sha256
          if-no-files-found: error
          retention-days: 14