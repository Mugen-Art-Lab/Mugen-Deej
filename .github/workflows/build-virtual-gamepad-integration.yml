name: Build virtual gamepad integration

on:
  workflow_dispatch:
  push:
    branches:
      - feature/virtual-gamepad-ui
    paths:
      - '.github/workflows/build-virtual-gamepad-integration.yml'
      - 'MugenDeej.ps1'
      - 'MugenDeej-Debug.cmd'
      - 'MugenDeej.ico'
      - 'src/launcher/**'
      - 'src/virtual-gamepad-helper/**'
      - 'src/virtual-gamepad-integration/**'
      - 'tools/Prepare-HIDMaestro.ps1'
      - 'tools/Build-VirtualGamepad-Integration.ps1'
      - 'tools/Harden-VirtualGamepad-DevRuntime.ps1'
      - 'tools/Apply-AdaptiveProtocol.ps1'
      - 'tools/Apply-AdaptiveButtonUi.ps1'
      - 'tools/Apply-AdaptiveInputStatusUi.ps1'
      - 'tools/Polish-AdaptiveInputStatusUi.ps1'
      - 'tools/Revise-AdaptiveMainUi.ps1'
      - 'tools/Harden-AdaptiveTopologyUi.ps1'
      - 'tools/Add-AdaptiveControlMappings.ps1'
      - 'tools/Add-AdaptiveLayers.ps1'
      - 'tools/Optimize-LargeButtonSettings.ps1'
      - 'tools/Run-OptimizedLargeButtonSettings.ps1'
      - 'tools/Polish-UiLanguage.ps1'
      - 'tools/Ensure-WindowsPowerShellUtf8Bom.ps1'

permissions:
  contents: read

jobs:
  build-integration:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/launcher/go.mod

      - name: Prepare pinned HIDMaestro dependency
        shell: pwsh
        run: .\tools\Prepare-HIDMaestro.ps1

      - name: Stage integrated runtime
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifacts\Mugen-Deej-VirtualGamepad-Integrated-Dev'
          $vgRoot = Join-Path $stage 'virtual-gamepad'
          $hostOut = Join-Path $vgRoot 'host'
          $firmwareRoot = Join-Path $stage 'firmware\MugenDeejCardboardNanoPrototype'
          New-Item -ItemType Directory -Path $hostOut -Force | Out-Null
          New-Item -ItemType Directory -Path $firmwareRoot -Force | Out-Null

          $runtimePath = Join-Path $stage 'MugenDeej.ps1'
          $integrationModulePath = Join-Path $vgRoot 'MugenDeej.VirtualGamepad.ps1'

          .\tools\Build-VirtualGamepad-Integration.ps1 `
            -SourcePath .\MugenDeej.ps1 `
            -OutputPath $runtimePath

          # The throwaway dev build must never steal the stable portable app's
          # HKCU Run registration merely because both share the Mugen Deej name.
          .\tools\Harden-VirtualGamepad-DevRuntime.ps1 -Path $runtimePath

          # Adaptive v3 is the self-describing typed-input protocol generation.
          # It keeps Legacy and Extended parsing intact while adding first-class
          # toggles and encoders for future DIY panels.
          .\tools\Apply-AdaptiveProtocol.ps1 -Path $runtimePath

          # Large DIY panels need a live wrapped button grid rather than the
          # old single horizontal strip and 30+ vertically stacked editor rows.
          .\tools\Apply-AdaptiveButtonUi.ps1 -Path $runtimePath

          # Keep first-class toggles and encoders visible as their own live
          # controls instead of flattening them into momentary-button status.
          .\tools\Apply-AdaptiveInputStatusUi.ps1 -Path $runtimePath

          # The first functional status UI used button-like rectangles. Polish
          # it into switch metaphors and a live rotary-knob indicator while
          # retaining the cumulative encoder position as the source of truth.
          .\tools\Polish-AdaptiveInputStatusUi.ps1 -Path $runtimePath

          # v17 still built one expensive editor row for every button and hid
          # most of them. The optimized large-controller editor creates one
          # shared action editor plus lightweight selector tiles and a fixed
          # assignment overview.
          .\tools\Run-OptimizedLargeButtonSettings.ps1 -Path $runtimePath

          Copy-Item .\src\virtual-gamepad-integration\MugenDeej.VirtualGamepad.ps1 $integrationModulePath -Force

          # The hardware-proven HIDMaestro teardown takes about ten seconds on
          # the test machine. Append the dev-stage override after the core
          # module so Stop-MugenVirtualGamepad becomes nonblocking while still
          # preventing a new controller from starting until cleanup completes.
          $asyncStopOverlay = [System.IO.File]::ReadAllText(
            (Resolve-Path '.\src\virtual-gamepad-integration\MugenDeej.VirtualGamepad.AsyncStop.ps1'),
            [System.Text.Encoding]::UTF8
          )
          [System.IO.File]::AppendAllText(
            $integrationModulePath,
            ("`r`n" + $asyncStopOverlay),
            (New-Object System.Text.UTF8Encoding($false))
          )

          # Windows PowerShell 5.1 treats UTF-8 source without a BOM as the
          # active ANSI code page. Both files contain Cyrillic UI strings, so
          # a missing BOM corrupts tokens before execution and causes launcher
          # parse errors on Russian Windows installations.
          .\tools\Ensure-WindowsPowerShellUtf8Bom.ps1 -Path @(
            $runtimePath,
            $integrationModulePath
          )

          # Apply user-facing copy only after the final topology/mapping/layer
          # patches have been staged by the encoding finalizer. The copy pass
          # writes BOM-preserving UTF-8 so Windows PowerShell 5.1 remains safe.
          .\tools\Polish-UiLanguage.ps1 `
            -RuntimePath $runtimePath `
            -IntegrationModulePath $integrationModulePath

          Copy-Item .\src\virtual-gamepad-helper\deps\HIDMaestro-LICENSE.txt $vgRoot -Force
          Copy-Item .\arduino\MugenDeejCardboardNanoPrototype\MugenDeejCardboardNanoPrototype.ino $firmwareRoot -Force
          Copy-Item .\MugenDeej.ico $stage -Force
          Copy-Item .\MugenDeej-Debug.cmd $stage -Force
          Copy-Item .\LICENSE $stage -Force
          Copy-Item .\THIRD_PARTY_NOTICES.md $stage -Force

          dotnet publish .\src\virtual-gamepad-helper\MugenDeej.VirtualGamepadHost.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $hostOut

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE"
          }

          & (Join-Path $hostOut 'MugenDeej.VirtualGamepadHost.exe') --help
          if ($LASTEXITCODE -ne 0) {
            throw "Published helper smoke check failed with exit code $LASTEXITCODE"
          }

      - name: Parse-check PowerShell 5.1 runtime
        shell: powershell
        run: |
          $paths = @(
            '.\artifacts\Mugen-Deej-VirtualGamepad-Integrated-Dev\MugenDeej.ps1',
            '.\artifacts\Mugen-Deej-VirtualGamepad-Integrated-Dev\virtual-gamepad\MugenDeej.VirtualGamepad.ps1'
          )

          foreach ($path in $paths) {
            $resolved = (Resolve-Path $path).Path
            $bytes = [System.IO.File]::ReadAllBytes($resolved)
            if (
              $bytes.Length -lt 3 -or
              $bytes[0] -ne 0xEF -or
              $bytes[1] -ne 0xBB -or
              $bytes[2] -ne 0xBF
            ) {
              throw "Windows PowerShell runtime is missing UTF-8 BOM: $path"
            }

            $tokens = $null
            $errors = $null
            $text = [System.IO.File]::ReadAllText($resolved, (New-Object System.Text.UTF8Encoding($false, $true)))
            [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              foreach ($parseError in $errors) {
                Write-Error ("{0}:{1}: {2}" -f $parseError.Extent.StartLineNumber,$parseError.Extent.StartColumnNumber,$parseError.Message)
              }
              throw "PowerShell 5.1 parse check failed for $path"
            }
          }

          $runtime = '.\artifacts\Mugen-Deej-VirtualGamepad-Integrated-Dev\MugenDeej.ps1'
          $runtimeText = [System.IO.File]::ReadAllText((Resolve-Path $runtime), [System.Text.Encoding]::UTF8)
          if ($runtimeText -match '(?m)^Sync-StartupRegistrationPath\s*$') {
            throw 'Development runtime still contains active startup registration sync.'
          }
          if ($runtimeText -notmatch "Development build: Windows startup registration sync suppressed") {
            throw 'Development runtime is missing the startup-isolation marker.'
          }
          if ($runtimeText -notmatch 'Legacy and Extended retain the stable wording') {
            throw 'Development runtime no longer preserves Legacy/Extended connected-status wording.'
          }
          if ($runtimeText -notmatch 'Adaptive v3 can expose four independent families') {
            throw 'Development runtime is missing full-word Adaptive connected-status text.'
          }
          if ($runtimeText -match 'Format-RussianControllerCount') {
            throw 'Development runtime still calls the staging-only Russian count helper.'
          }
          if ($runtimeText -notmatch '\$formatRussianCount = \{') {
            throw 'Development runtime is missing the self-contained Adaptive Russian plural formatter.'
          }
          if ($runtimeText -notmatch '\[AllowEmptyCollection\(\)\]\[object\[\]\]\$Actions') {
            throw 'Development runtime still rejects valid empty button-action arrays.'
          }
          if ($runtimeText -notmatch '\[AllowEmptyCollection\(\)\]\[object\[\]\]\$Toggles') {
            throw 'Development runtime still rejects valid empty Adaptive toggle arrays.'
          }
          if ($runtimeText -notmatch '\[AllowEmptyCollection\(\)\]\[object\[\]\]\$Encoders') {
            throw 'Development runtime still rejects valid empty Adaptive encoder arrays.'
          }
          if ($runtimeText -notmatch '\$dialog\.OverwritePrompt = \$false') {
            throw 'Development runtime still delegates backup overwrite confirmation to the OS language.'
          }
          if ($runtimeText -notmatch 'Desktop control surface') {
            throw 'Development runtime is missing the protocol-agnostic control-surface subtitle.'
          }
          if ($runtimeText -notmatch '\$statusDot\.AutoSize = \$false') {
            throw 'Development runtime is missing the fixed-size physical status dot.'
          }
          if ($runtimeText -notmatch '\$statusDot\.TextAlign = ') {
            throw 'Development runtime is missing centered physical status-dot alignment.'
          }
          if ($runtimeText -notmatch 'Spatial Xbox-style control map') {
            throw 'Development runtime is missing the spatial Xbox control picker.'
          }
          if ($runtimeText -notmatch 'Choose a virtual Xbox gamepad control') {
            throw 'Virtual-gamepad picker still uses the ambiguous bare-Xbox heading.'
          }
          if ($runtimeText -notmatch '\$picker\.ClientSize = \[System\.Drawing\.Size\]::new\(760, 625\)') {
            throw 'Development runtime is missing the wide Xbox-map picker layout.'
          }
          if ($runtimeText -notmatch "'virtual:xbox:a',\s+604, 320") {
            throw 'Development runtime does not place ABXY in the Xbox-style right-side diamond.'
          }
          if ($runtimeText -notmatch "'virtual:xbox:dpad:left',\s+96, 458") {
            throw 'Development runtime does not place the D-pad on the lower-left side.'
          }
          if ($runtimeText -notmatch 'native overwrite prompt follows the Windows shell language') {
            throw 'Development runtime is missing the app-localized backup overwrite handler.'
          }
          if ($runtimeText -notmatch 'The backup file already exists') {
            throw 'Development runtime is missing the bilingual overwrite-confirmation block.'
          }
          if ($runtimeText -notmatch 'if \(\$advancedPanel\.Visible\) \{\s*Update-DriverStatus') {
            throw 'Development runtime still performs the slow driver refresh on every language switch.'
          }
          if ($runtimeText -notmatch "Protocol = 'adaptive'") {
            throw 'Development runtime is missing Adaptive v3 protocol parsing.'
          }
          if ($runtimeText -notmatch '\$candidateFirstSeenAt = \[DateTime\]::MinValue') {
            throw 'Controller probe is missing candidate-stability tracking.'
          }
          if ($runtimeText -notmatch '\$legacyMinStableMs = if \(\$legacyObservedSliders -eq \$legacyExpectedSliders\) \{ 300 \} else \{ 900 \}') {
            throw 'Controller probe is missing confidence delays for Legacy candidates.'
          }
          if ($runtimeText -notmatch 'Legacy probe candidate deferred:') {
            throw 'Controller probe is missing diagnostics for deferred Legacy candidates.'
          }
          if ($runtimeText -notmatch "Firmware debounce diagnostics active") {
            throw 'Development runtime is missing Adaptive firmware debounce diagnostics.'
          }
          if ($runtimeText -notmatch "\^d\(\\d\{1,3\}\)") {
            throw 'Development runtime is missing the optional Adaptive debounce diagnostic token parser.'
          }

          $firmwarePath = '.\arduino\MugenDeejCardboardNanoPrototype\MugenDeejCardboardNanoPrototype.ino'
          $firmwareText = [System.IO.File]::ReadAllText((Resolve-Path $firmwarePath), [System.Text.Encoding]::UTF8)
          if ($firmwareText -notmatch 'MATRIX_DEBOUNCE_MS = 6') {
            throw 'Cardboard Nano firmware is not using the 6 ms gameplay debounce experiment.'
          }
          if ($firmwareText -notmatch 'matrixFilteredBounceCount') {
            throw 'Cardboard Nano firmware is missing filtered-bounce diagnostics.'
          }
          if ($firmwareText -notmatch 'matrixRapidReversalCount') {
            throw 'Cardboard Nano firmware is missing accepted rapid-reversal diagnostics.'
          }
          if ($runtimeText -notmatch '\$script:DetectedToggleCount = 0') {
            throw 'Development runtime is missing typed toggle capability state.'
          }
          if ($runtimeText -notmatch '\$script:DetectedEncoderCount = 0') {
            throw 'Development runtime is missing typed encoder capability state.'
          }
          if ($runtimeText -notmatch 'eN\[:P\] reports a cumulative signed detent position') {
            throw 'Development runtime is missing Adaptive encoder-position semantics.'
          }
          if ($runtimeText -notmatch 'function Get-AdaptiveButtonLayoutMetrics') {
            throw 'Development runtime is missing adaptive main-window button layout.'
          }
          if ($runtimeText -notmatch 'function Get-AdaptiveInputUiText') {
            throw 'Development runtime is missing Adaptive toggle/encoder status UI.'
          }
          if ($runtimeText -notmatch "'Push' \{") {
            throw 'Development runtime is missing encoder push-state presentation.'
          }
          if ($runtimeText -notmatch 'Endless encoders have no absolute min/max') {
            throw 'Development runtime is missing polished encoder-knob visualization.'
          }
          if ($runtimeText -notmatch '\$compactButtonMode = \(\$script:DetectedButtonCount -gt 12\)') {
            throw 'Development runtime is missing the staged compact high-button settings foundation.'
          }
          if ($runtimeText -notmatch 'function Show-LargeButtonSettings') {
            throw 'Development runtime is missing the optimized large-button settings editor.'
          }
          if ($runtimeText -notmatch 'Large button settings UI prepared') {
            throw 'Development runtime is missing large-button editor timing diagnostics.'
          }
          if ($runtimeText -notmatch 'Assigned: \{0\} of \{1\}') {
            throw 'Development runtime is missing the scalable assignment overview.'
          }
          if ($runtimeText -notmatch 'Press a button on the controller and Mugen will select it automatically') {
            throw 'Development runtime is missing physical-button auto-selection guidance.'
          }
          if ($runtimeText -notmatch 'Button actions') {
            throw 'Development runtime is missing the simplified button-settings heading.'
          }
          if ($runtimeText -notmatch 'Toggle and encoder actions') {
            throw 'Development runtime is missing the simplified toggle/encoder heading.'
          }
          if ($runtimeText -notmatch 'Layer switching') {
            throw 'Development runtime is missing the user-facing layer-switching wording.'
          }
          if ($runtimeText -notmatch 'Same as base layer') {
            throw 'Development runtime is missing the user-facing layer inheritance wording.'
          }
          if ($runtimeText -notmatch 'Port selection') {
            throw 'Diagnostics are missing the clearer port-selection label.'
          }
          if ($runtimeText -notmatch 'Selected button: ') {
            throw 'Button editor is missing the selected-button punctuation polish.'
          }
          if ($runtimeText -notmatch 'Only the selected button is edited on the right; the list below shows all assignments') {
            throw 'Button editor is missing the deliberate two-line guidance copy.'
          }
          if ($runtimeText -notmatch 'Which application should have its own profile?') {
            throw 'Application-profile picker is missing the clearer heading.'
          }
          if ($runtimeText -notmatch 'The new profile will start with a copy of the current Global mappings') {
            throw 'Application-profile picker is missing the clearer copy-source explanation.'
          }
          if ($runtimeText -notmatch "\$pickerAdd\.Text = if \(\$script:Language -eq 'ru'\) \{ 'Создать' \} else \{ 'Create' \}") {
            throw 'Application-profile picker is missing the explicit Create action.'
          }
          if ($runtimeText -notmatch 'Choose a specific display and anchor for multi-monitor setups') {
            throw 'Layer notification dialog is missing the balanced second help line.'
          }
          if ($runtimeText -notmatch 'Same as base layer.*keeps the normal encoder mapping from the selected profile') {
            throw 'Layered encoder dialog is missing the balanced second help line.'
          }
          if ($runtimeText -notmatch 'T1 and T2 can have separate button and encoder actions') {
            throw 'Toggle/encoder settings are missing the simplified layer-settings hint.'
          }
          if ($runtimeText -notmatch 'Only separate actions for this layer are shown') {
            throw 'Layer assignment sidebar is missing the compact explanatory copy.'
          }
          if ($runtimeText -notmatch 'opacityLabel\.Size = \[System\.Drawing\.Size\]::new\(140, 25\)') {
            throw 'Layer notification opacity label is still too narrow.'
          }
          if ($runtimeText -match 'Physical button actions') {
            throw 'Development runtime still exposes the old physical-button heading.'
          }
          if ($runtimeText -notmatch '\$buttonEditorState\.LastButtons') {
            throw 'Development runtime is missing isolated live button-editor state.'
          }
          if ($runtimeText -notmatch 'A USB hot-unplug can therefore happen while') {
            throw 'Development runtime is missing the physical-button settings hot-unplug guard.'
          }
          if ($runtimeText -match '\$state\.LastButtons') {
            throw 'Development runtime still contains the vulnerable generic button-editor state reference.'
          }
          if ($runtimeText -notmatch '\$script:AdaptiveActionConfigPath') {
            throw 'Development runtime is missing first-class Adaptive action persistence.'
          }
          if ($runtimeText -notmatch 'function Invoke-AdaptiveMappedAction') {
            throw 'Development runtime is missing first-class toggle/encoder action execution.'
          }
          if ($runtimeText -notmatch 'function Show-AdaptiveControlSettings') {
            throw 'Development runtime is missing toggle/encoder settings UI.'
          }
          if ($runtimeText -notmatch 'function Show-FullControllerStateWindow') {
            throw 'Development runtime is missing full controller-state window.'
          }
          if ($runtimeText -notmatch '\$sliderViews = @\(\)') {
            throw 'Development runtime is missing visual full-state control rendering.'
          }
          if ($runtimeText -notmatch 'schemaVersion = 3') {
            throw 'Development runtime is missing universal backup schema v3.'
          }
          if ($runtimeText -notmatch 'adaptiveLayers = \$layerConfig') {
            throw 'Universal backup does not include Adaptive layer configuration.'
          }
          if ($runtimeText -notmatch 'virtualController = \$virtualConfig') {
            throw 'Universal backup does not include virtual-controller configuration.'
          }
          if ($runtimeText -notmatch 'Adaptive layers restored from backup') {
            throw 'Universal backup restore does not restore Adaptive layers.'
          }
          if ($runtimeText -notmatch 'Virtual controller setting restored from backup') {
            throw 'Universal backup restore does not restore the virtual-controller setting.'
          }
          if ($runtimeText -notmatch '\$visibleEncoderCount = \[Math\]::Min\(\$encoderCount, 3\)') {
            throw 'Development runtime is missing the three-encoder compact summary limit.'
          }
          if ($runtimeText -notmatch "\$settingsButton.Tag = ''") {
            throw 'Development runtime still styles regulator settings as the primary main action.'
          }
          if ($runtimeText -notmatch "\$script:AdaptiveSettingsButton.Font = New-Object System.Drawing.Font\('Segoe UI Semibold', 10\)") {
            throw 'Development runtime is missing consistent typed-settings button typography.'
          }
          if ($runtimeText -notmatch 'Your controller is connected and ready') {
            throw 'Development runtime is missing capability-driven first-run onboarding.'
          }
          if ($runtimeText -notmatch 'The connected controller does not expose any physical analog controls') {
            throw 'Development runtime is missing the zero-slider settings guard.'
          }
          if ($runtimeText -match 'Turn a knob or move a fader — the matching indicator should move') {
            throw 'Development runtime still contains the legacy slider-only first-run wizard.'
          }
          if ($runtimeText -notmatch 'LastHasPush') {
            throw 'Development runtime is missing persistent encoder push-capability tracking.'
          }
          if ($runtimeText -notmatch 'with push') {
            throw 'Development runtime is missing encoder push-capability labeling.'
          }
          if ($runtimeText -notmatch 'DrawEllipse\(\$pushCuePen, 11, 11, 6, 6\)') {
            throw 'Development runtime is missing the centered encoder push-capability ring.'
          }
          if ($runtimeText -notmatch '\$portName\.Text = if \(\$ru\)') {
            throw 'Development runtime is missing separated first-run Port label/value rendering.'
          }
          if ($runtimeText -notmatch '\$protocolName\.Text = if \(\$ru\)') {
            throw 'Development runtime is missing separated first-run Protocol label/value rendering.'
          }
          if ($runtimeText -notmatch '\$baudName\.Text = if \(\$ru\)') {
            throw 'Development runtime is missing separated first-run speed label/value rendering.'
          }
          if ($runtimeText -notmatch '\$value\.ForeColor = \[System\.Drawing\.Color\]::SeaGreen') {
            throw 'Development runtime is missing green first-run connection values.'
          }
          if ($runtimeText -notmatch '\$connectedDetailsPanel\.Visible = \$false') {
            throw 'Development runtime is missing atomic disconnected-state switching in the first-run wizard.'
          }
          if ($runtimeText -notmatch '\$waitingPanel\.Visible = \$true') {
            throw 'Development runtime is missing the first-run waiting panel.'
          }
          if ($runtimeText -notmatch '\$connectedDetailsPanel\.Tag = ''MugenCardInner''') {
            throw 'Development runtime is missing the card-inner theme tag on connected first-run details.'
          }
          if ($runtimeText -notmatch '\$waitingPanel\.Tag = ''MugenCardInner''') {
            throw 'Development runtime is missing the card-inner theme tag on waiting first-run details.'
          }
          if ($runtimeText -notmatch '\[string\]\$Control\.Tag -eq ''MugenCardInner''') {
            throw 'Development runtime does not preserve the Mugen card surface for tagged inner panels.'
          }
          if ($runtimeText -match 'foreach \(\$control in @\(\$portName, \$portValue, \$protocolName') {
            throw 'Development runtime still toggles first-run detail labels individually.'
          }
          if ($runtimeText -notmatch 'First-run wizard refresh failed') {
            throw 'Development runtime is missing the guarded first-run timer refresh.'
          }
          if ($runtimeText -notmatch 'Resume recovery armed for fresh detection') {
            throw 'Development runtime is missing same-COM resume replug detection.'
          }
          if ($runtimeText -notmatch 'starting bounded readiness retry window') {
            throw 'Development runtime is missing the bounded post-hotplug resume retry window.'
          }
          if ($runtimeText -notmatch 'Targeted resume retry on .* is still not ready') {
            throw 'Development runtime is missing repeated targeted resume retries.'
          }
          if ($runtimeText -notmatch '\$script:ResumeHotplugRetrySeconds = 2') {
            throw 'Development runtime is missing the short resume hotplug retry interval.'
          }
          if ($runtimeText -notmatch '\$script:ResumeHotplugRetryWindowSeconds = 20') {
            throw 'Development runtime is missing the bounded resume hotplug retry horizon.'
          }
          if ($runtimeText -notmatch '\$script:ResumeHotplugSlowRetrySeconds = 10') {
            throw 'Development runtime is missing the low-frequency resume reconnect interval.'
          }
          if ($runtimeText -notmatch 'continuing low-frequency targeted retries every') {
            throw 'Development runtime can still stop retrying the preferred COM after resume.'
          }
          if ($runtimeText -notmatch 'Controller recovery armed for') {
            throw 'Development runtime is missing generic last-controller recovery after runtime serial loss.'
          }
          if ($runtimeText -notmatch 'Controller recovery attempt on') {
            throw 'Development runtime is missing targeted same-COM runtime recovery attempts.'
          }
          if ($runtimeText -notmatch '\$script:ControllerRecoverySlowSeconds = 10') {
            throw 'Development runtime is missing low-frequency runtime recovery cadence.'
          }
          if ($runtimeText -notmatch 'function Test-IsTransientPortOpenError') {
            throw 'Development runtime is missing the transient COM-open classifier.'
          }
          if ($runtimeText -notmatch 'transient hotplug state') {
            throw 'Development runtime still sends freshly enumerated-but-not-openable COM ports into the long failed-open backoff.'
          }
          if ($runtimeText -notmatch 'Set-PortProbeCooldown -PortName \$PortName -Seconds \$retrySeconds') {
            throw 'Development runtime is missing the short transient hotplug cooldown.'
          }
          if ($runtimeText -notmatch 'Select-Object -Unique') {
            throw 'Development runtime does not deduplicate transient duplicate COM names.'
          }
          if ($runtimeText -match '\[Environment\]::TickCount64') {
            throw 'Development runtime uses Environment.TickCount64, which is unavailable in Windows PowerShell 5.1/.NET Framework.'
          }
          if ($runtimeText -notmatch "SliderAdvancedPanel") {
            throw 'Development runtime is missing the uniquely named slider Advanced-settings panel.'
          }
          if ($runtimeText -notmatch "SliderInvertAllCheck") {
            throw 'Development runtime is missing stable slider inversion control lookup.'
          }
          if ($runtimeText -notmatch '(?ms)\$saveButton\.Add_Click\(\{\s*param\(\$sender,\s*\$eventArgs\)') {
            throw 'Slider Save click handler does not bind sender/eventArgs before dialog-scoped control lookup.'
          }
          if ($runtimeText -match "SliderAdvancedHost") {
            throw 'Development runtime still uses the removed collapsible slider Advanced host.'
          }
          if ($runtimeText -match 'Ignored duplicate slider advanced-settings Click event') {
            throw 'Development runtime still contains the obsolete slider Advanced collapse click guard.'
          }
          if ($runtimeText -notmatch '\$sliderAdvancedPanel = New-Object MugenDeejWindowing\.MugenCardPanel') {
            throw 'Development runtime is missing the always-visible slider Advanced card.'
          }
          if ($runtimeText -notmatch '\$sliderAdvancedPanel\.Visible = \$true') {
            throw 'Slider Advanced card is not permanently visible.'
          }
          if ($runtimeText -notmatch '\$sliderAdvancedPanel\.Location = New-Object System\.Drawing\.Point\(25, \$advancedY\)') {
            throw 'Slider Advanced card is not positioned after the dynamic slider rows.'
          }
          if ($runtimeText -notmatch '\$actionY = \$advancedY \+ 134') {
            throw 'Slider action row can overlap the always-visible Advanced card.'
          }
          if ($runtimeText -notmatch 'if \(\$count -gt 5\) \{\s*\$settingsForm\.AutoScroll = \$true') {
            throw 'Normal five-slider settings still enable unnecessary form autoscroll.'
          }
          if ($runtimeText -notmatch 'AdaptiveLayerConfigPath = Join-Path \$script:BaseDir ''adaptive-layers\.json''') {
            throw 'Development runtime is missing the separate Adaptive layer configuration path.'
          }
          if ($runtimeText -notmatch 'function Get-AdaptiveLayerIndexFromValues') {
            throw 'Development runtime is missing Adaptive T1/T2 layer resolution.'
          }
          if ($runtimeText -notmatch 'names = \[pscustomobject\]\[ordered\]@\{') {
            throw 'Adaptive layer configuration is missing persisted custom layer names.'
          }
          if ($runtimeText -notmatch 'function ConvertTo-SafeAdaptiveLayerCustomName') {
            throw 'Adaptive layer custom names are not normalized safely.'
          }
          if ($runtimeText -notmatch 'function Get-AdaptiveLayerDisplayNameFromConfig') {
            throw 'Adaptive UI cannot resolve custom layer display names.'
          }
          if ($runtimeText -notmatch 'public sealed class MugenLayerPopupForm : Form') {
            throw 'Development runtime is missing the non-activating layer popup form.'
          }
          if ($runtimeText -notmatch 'WS_EX_NOACTIVATE') {
            throw 'Layer popup can steal focus because the no-activate window style is missing.'
          }
          if ($runtimeText -notmatch 'notification = \[pscustomobject\]\[ordered\]@\{') {
            throw 'Adaptive layer config is missing popup notification settings.'
